name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify publication policy and documentation
        run: python3 tools/check_repository.py
      - name: Test publication checks
        run: python3 -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/app.js
      - name: Build and test C reference book
        run: |
          set -eu
          for compiler in gcc clang; do
            cmake -S . -B "build/${compiler}" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER="${compiler}"
            cmake --build "build/${compiler}"
            ctest --test-dir "build/${compiler}" --output-on-failure
            cmake -S . -B "build/${compiler}-sanitize" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER="${compiler}" -DQSL_ENABLE_SANITIZERS=ON
            cmake --build "build/${compiler}-sanitize"
            ctest --test-dir "build/${compiler}-sanitize" --output-on-failure
          done
      - name: Check whitespace
        run: git diff-tree --check --root HEAD
